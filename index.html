


<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YJ.gh - Electronics Store</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f4f7;
}

header {
    background: #ff6600;
    color: white;
    padding: 20px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 32px;
}

.search {
    display: flex;
    padding: 15px;
    background: white;
}

.search input {
    flex: 1;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 5px;
}

.search button {
    background: #ff6600;
    color: white;
    border: none;
    padding: 12px;
    margin-left: 5px;
    border-radius: 5px;
}

.banner {
    background: #14213d;
    color: white;
    text-align: center;
    padding: 30px 10px;
}

.banner h2 {
    font-size: 28px;
}

.container {
    padding: 15px;
}

.products {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

.product {
    background: white;
    border-radius: 10px;
    padding: 12px;
    text-align: center;
}

.product img {
    width: 100%;
    height: 130px;
    object-fit: contain;
}

.product h3 {
    font-size: 15px;
}

.price {
    color: #ff6600;
    font-weight: bold;
}

.product button {
    background: #ff6600;
    color: white;
    border: none;
    padding: 10px;
    width: 100%;
    border-radius: 5px;
}

footer {
    background: #14213d;
    color: white;
    text-align: center;
    padding: 20px;
    margin-top: 20px;
}
</style>
</head>

<body>

<header>
<h1>YJ.gh</h1>
<p>Electronics Shopping Marketplace</p>
</header>

<div class="search">
<input type="text" id="search" placeholder="Search phones, laptops, drones...">
<button onclick="searchProducts()">Search</button>
</div>

<div class="banner">
<h2>Welcome to YJ.gh</h2>
<p>Discover electronics at amazing prices!</p>
</div>

<div class="container">
<h2>🔥 Featured Products</h2>

<div class="products" id="products">

<div class="product">
<img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=400">
<h3>Smartphone</h3>
<p class="price">GHS 1,500</p>
<button onclick="buy('Smartphone')">Buy Now</button>
</div>

<div class="product">
<img src="https://images.unsplash.com/photo-1496181133206-80ce9b88a853?w=400">
<h3>Laptop Computer</h3>
<p class="price">GHS 3,500</p>
<button onclick="buy('Laptop Computer')">Buy Now</button>
</div>

<div class="product">
<img src="https://images.unsplash.com/photo-1473968512647-3e447244af8f?w=400">
<h3>Drone</h3>
<p class="price">GHS 2,500</p>
<button onclick="buy('Drone')">Buy Now</button>
</div>

<div class="product">
<img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400">
<h3>Headphones</h3>
<p class="price">GHS 250</p>
<button onclick="buy('Headphones')">Buy Now</button>
</div>

</div>
</div>

<footer>
<p>© 2026 YJ.gh</p>
<p>Contact: WhatsApp for orders</p>
</footer>

<script>
function buy(product) {
    window.open("https://wa.me/233535079121?text=" +
    encodeURIComponent("Hello YJ.gh, I want to buy " + product));
}

function searchProducts() {
    let input = document.getElementById("search").value.toLowerCase();
    let products = document.querySelectorAll(".product");

    products.forEach(function(product) {
        product.style.display =
        product.innerText.toLowerCase().includes(input)
        ? "block" : "none";
    });
}
</script>

</body>
</html>
